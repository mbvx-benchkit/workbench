name: Workbench security and quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '21 0 * * 1'

permissions:
  contents: read

concurrency:
  group: workbench-security-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'push' || github.event_name }}
  cancel-in-progress: false

jobs:
  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout real commits for history audit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --show-error --silent --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          chmod 755 "$RUNNER_TEMP/gitleaks-bin/gitleaks"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Audit Git history and secrets
        run: npm run audit:history

      - name: Checkout the actual PR merge snapshot for build and tests
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install locked dependencies
        if: github.event_name != 'schedule'
        run: npm ci --strict-allow-scripts --no-audit

      - name: Build, test and audit once
        if: github.event_name != 'schedule'
        run: |
          npm run verify
          git ls-files --error-unmatch CHANGELOG.md
          git diff --exit-code -- CHANGELOG.md

      - name: Prepare and audit Pages artifact
        if: github.event_name != 'schedule'
        run: |
          npm run build:site
          gitleaks dir --redact --no-banner site

      - name: Browser smoke tests (Chromium)
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/workbench-e2e-venv"
          py="$RUNNER_TEMP/workbench-e2e-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check 'playwright==1.57.0'
          "$py" -m playwright install --with-deps chromium
          "$py" scripts/e2e-workbench.py --project "$GITHUB_WORKSPACE/site" --site

      - name: Upload verified Pages artifact
        if: github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          name: workbench-site
          retention-days: 1

      - name: Weekly dependency audit without rebuilding
        if: github.event_name == 'schedule'
        run: npm audit --audit-level=high

  deploy:
    name: Deploy audited Pages artifact
    needs: security
    # Explicit opt-in prevents a deployment while Pages still uses the legacy source.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.WORKBENCH_PAGES_DEPLOY == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject stale main deployments
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$current" != "$GITHUB_SHA" ]]; then
            echo 'Main has moved; this older run must not deploy.' >&2
            exit 1
          fi

      # No checkout, installation or rebuild: deploy only this run's audited artifact.
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: workbench-site

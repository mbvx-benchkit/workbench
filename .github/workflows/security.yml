name: Workbench security and quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '21 0 * * 1'

permissions:
  contents: read

concurrency:
  group: workbench-security-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout real commits for history audit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install verified Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --show-error --silent --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          chmod 755 "$RUNNER_TEMP/gitleaks-bin/gitleaks"
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"

      - name: Audit Git history and secrets
        run: npm run audit:history

      - name: Checkout the actual PR merge snapshot for build and tests
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install locked dependencies
        if: github.event_name != 'schedule'
        run: npm ci

      - name: Build, test and audit once
        if: github.event_name != 'schedule'
        run: npm run verify

      - name: Prepare and audit Pages artifact
        if: github.event_name != 'schedule'
        run: npm run build:site

      - name: Browser smoke tests (Chromium)
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/workbench-e2e-venv"
          py="$RUNNER_TEMP/workbench-e2e-venv/bin/python"
          "$py" -m pip install --disable-pip-version-check 'playwright==1.57.0'
          "$py" -m playwright install --with-deps chromium
          "$py" scripts/e2e-workbench.py --project "$GITHUB_WORKSPACE/site" --site

      - name: Upload verified Pages artifact (no deployment yet)
        if: github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
          name: workbench-site
          retention-days: 1

      - name: Weekly dependency audit without rebuilding
        if: github.event_name == 'schedule'
        run: npm audit --audit-level=high
